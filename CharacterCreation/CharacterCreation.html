<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://use.fontawesome.com/releases/v7.1.2/js/all.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.1.2/css/all.css">
    <title>Character Creation</title>
</head>
<style>
    @import url('https://use.fontawesome.com/releases/v7.1.2/css/all.css');

    * {
        overflow: hidden;
    }
    
    body {
    background-size: 105%;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-position: center;
    text-transform: uppercase;
}

#exitGameMenu, #characterCreator, #characterEditor, #deleteCharacterMenu, #spawnLocation {
    display: none;
}

/* Main page */
#overlay {
    top: 0px;
    left: 0px;
    height: 100vh;
    width: 30vw;
    background: darkblue;
    position: fixed;
}

#characterCreator, #characterEditor, #exitGameMenu, #deleteCharacterMenu, #spawnLocation {
    display: none;
}

#charactersSection {
    height: 50%;
    margin: none;
    padding: none;
    width: 83%;
    overflow-y: scroll;
}

::-webkit-scrollbar {
    width: 10px;
}
::-webkit-scrollbar-track {
    background: rgba(2, 2, 2, 0);
}
::-webkit-scrollbar-thumb {
    background: rgba(99, 99, 99, 0.575);
    border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
    background: rgb(128, 128, 128);
    border-radius: 10px;
}

#logoContainer {
    margin-top: 3vh;
    margin-left: 10vw;
}
#logo {
    height: 10vw;
    width: 10vw;
}

#serverName {
    color: white;
    font-size: 130%;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    text-align: center;
    font-weight: bolder;
}

.mainPage {
    color: white;
    font-size: 95%;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    text-align: center;
    font-weight: lighter;
}

.homeScreenButton, .createdButton, .createdButtonEdit, .createdButtonDelete {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-weight: bold;
    text-align: center;
    border: none;
    color: white;
}

#Choosenclose {
    margin-left: 9vw;
    margin-bottom: 0.8vh;
    height: 4.5vh;
    width: 12vw;
    background: rgb(95, 141, 254);
    background-image: linear-gradient(90deg, rgba(95,141,254,1) 0%, rgba(142,104,219,1) 100%);
    border-radius: 5vw;
    transition: 0.3s;
}

#newCharacterButton {
    margin-left: 9vw;
    margin-bottom: 0.8vh;
    height: 4.5vh;
    width: 12vw;
    background: rgb(95,141,254);
    background-image: linear-gradient(90deg, rgba(95,141,254,1) 0%, rgba(142,104,219,1) 100%);
    border-radius: 5vw;
    transition: 0.3s;
}

#quitGameButton {
    margin-left: 10vw;
    margin-bottom: 5vh;
    height: 4.5vh;
    width: 10vw;
    background: rgb(255,110,100);
    background: linear-gradient(90deg, rgb(255, 100, 208) 0%, rgb(255, 60, 109) 100%);
    border-radius: 5vw;
    transition: 0.3s;
}

.createdButton {
    display: inline-block;
    margin-bottom: 1vh;
    margin-left: 5.5vw;
    height: 3vh;
    width: 10vw;
    background-color: rgb(17, 113, 238);
    border: none;
    border-radius: 0.5vh;
    transition: 0.3s;
    white-space: nowrap;
    text-transform: capitalize;
}

.createdButtonEdit {
    margin-left: 0.2vw;
    height: 3vh;
    width: 4vw;
    background-color: rgb(128, 128, 128);
    border: none;
    border-radius: 0.5vh;
    transition: 0.3s;
}

.createdButtonDelete {
    margin-left: 0.2vw;
    height: 3vh;
    width: 4vw;
    background-color: rgb(236, 19, 19);
    border: none;
    border-radius: 0.5vh;
    transition: 0.3s;
}

/* Button transitions */
#newCharacterButton:hover, #quitGameButton:hover, .characterSubmitButton:hover, .characterResetButton:hover, .confirmationScreenConfirm:hover, .confirmationScreenCancel:hover, .createdButton:hover, .createdButtonEdit:hover, .createdButtonDelete:hover, .spawnButtons:hover {
    transition: 0.3s;
    opacity: 0.7;
}
#newCharacterButton:active, #quitGameButton:active, .characterSubmitButton:active, .characterResetButton:active, .confirmationScreenConfirm:active, .confirmationScreenCancel:active, .createdButton:active, .createdButtonEdit:active, .createdButtonDelete:active, .spawnButtons:active {
    transition: none;
    opacity: 1;
}

/* Character creator and Editor menu */
.characterMenu {
    height: 60%;
    width: 50vw;
    margin: auto 0 auto 40vw;
    background:darkblue;
    border-radius: 3vh;
}

#characterCreatorTopText {
    padding-top: 2vh;
    margin-left: 3vw;
    color: white;
    font-size: 120%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-weight: bold;
}

#characterCreatorTopTextLine {
    background: rgb(255, 255, 255);
    background: linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, rgba(255,255,255,1) 15%, rgba(255,255,255,1) 85%, rgba(0, 0, 0, 0.014) 100%);
    height: 0.1vh;
    width: 95%;
    border: none;
    border-radius: 2vh;
}

/* character info */
#characterInfoContainer {
    padding: 2vh 3vw;
}
#characterInfoContainerLeft {
    width: 50%;
    float: left;
}
#characterInfoContainerRight {
    width: 50%;
    display: inline-block;
}

.firstRowText, .secondRowText, .thirdRowText, .fourthRowText {
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-weight: bold;
}

.firstRowInput, .secondRowInput, .thirdRowInput, .fourthRowInput {
    background: white;
    color: black;
    border: none;
    border-radius: 0.2vw;
    height: 3vh;
    width: 95%;
    margin-top: 0.5vh;
    margin-bottom: 2vh;
    padding: 0 0 0 0.5vw;
}

.characterSubmitButton {
    margin-top: 1vh;
    margin-left: 33.7vw;
    margin-bottom: 2vh;
    width: 8vw;
    background-color: rgb(17, 113, 238);
}

.characterResetButton {
    width: 4vw;
    background-color: rgb(231, 50, 50);
}

.characterSubmitButton, .characterResetButton, .confirmationScreenConfirm, .confirmationScreenCancel, .spawnButtons {
    height: 4vh;
    color: white;
    font-weight: bold;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    border: none;
    border-radius: 1vh;
    transition: 0.3s;
}

/* confirmation Screen */
.confirmationScreen {
    height: 25vh;
    width: 30vw;
    margin-top: 20vh;
    margin-left: 45vw;
    background-color: rgba(2, 2, 2, 0.911);
    border-radius: 3vh;
}

.confirmationScreenConfirm {
    margin-top: 5vh;
    margin-left: 19%;
    margin-right: 5%;
    width: 8vw;
    background-color: rgb(17, 113, 238);
}

.confirmationScreenCancel {
    width: 9w;
    background-color: rgb(231, 50, 50);
}

.spawnMenu {
    height: 39%;
    width: 40vw;
    margin: auto 0 auto 40vw;
    background-color: rgba(2, 2, 2, 0.911);
    border-radius: 3vh;
}

#spawnMenuContainer {
    margin-top: 3vh;
    margin-left: 5%;
}

.spawnButtons {
    display: none;
    margin-left: 0;
    margin-bottom: 1vh;
    text-align: center;
    width: 95%;
    height: 4vh;
    background-color: rgb(17, 113, 238);
}

.text {
    font-family: "Pricedown Bl", sans-serif;
    position: absolute;
    font-size: 1vw;
    color: rgba(255, 255, 255, 0.925);
    margin: auto;
    text-align: center;
    padding: 0.15% 1.1%;
    background-color: rgba(0, 0, 0, 0.3);
    border-radius: 10vw;
}

.animated {
    overflow: hidden;
}
.animated > * {
    display: inline-block;
    position: relative;
    animation: 3s linear 0s infinite alternate move;
}
@keyframes move {
    0%, 25% {
        transform: translateX(0%);
        left: 0%;
    }
    75%, 100% {
        transform: translateX(-100%);
        left: 100%;
    }
}
</style>
<body>
    <section id="overlay">
        <div id="logoContainer">
            <img src="html/NFLogo.png" id="logo">
        </div>

        <h1 id="serverName"></h1>
        <p id="aop" class="mainPage" style="margin-bottom: -1vh;"></p>
        <p class="mainPage">Select or create a character: </p>

        <button class="homeScreenButton CloseCharacterContainer" id="Choosenclose"><i class="fas fa-times-circle"></i></button>
        <br>
        <button class="homeScreenButton" id="newCharacterButton"><i class="fas fa-plus-circle" style="color:white;"></i> Create New Character <a id="playerAmount"></a></button>
        <br>
        <button class="homeScreenButton" id="quitGameButton"><i class="fas fa-sign-out-alt" style="color:white;"></i> Quit Game</button>
        
        <div id="charactersSection"> <!--Characters will be added here--> </div>
    </section>

    <img src="html/path.png" alt="logo" id="backgroundImage" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">

    <!--Create character menu design-->
    <form id="characterCreator" class="characterMenu">
        <p id="characterCreatorTopText"><a class="fas fa-user-edit" style="color:white;"></a> Character Creation</p>
        <hr id="characterCreatorTopTextLine">
        <div id="characterInfoContainer">
            <div id="characterInfoContainerLeft">
                <!--First name-->
                <label class="firstRowText" for="firstname">First Name</label>
                <br>
                <input id="firstName" class="firstRowInput" type="text" placeholder="First Name" name="firstname" required>

                <br>

                <!--Dob-->
                <label class="secondRowText" for="dob">Date of Birth</label>
                <br>
                <input id="dateOfBirth" class="secondRowInput" type="date" name="dob" max="9999-12-31" required>
				
				<br>
				

                <!-- Character CSN -->
                <label class="secondRowText" for="CSN">CSN</label>
                <div id="CreateCSN" style="font-size: 20px; cursor:cell; width: 95%; padding: 15px 14px; text-align: center; position:relative; background: none; color: white; border: 2px solid crimson;"></div>
            </div>
            <div id="characterInfoContainerRight">
                <!--Last name-->
                <label class="firstRowText" for="lastname">Last Name</label>
                <br>
                <input id="lastName" style="width: 93%;" class="firstRowInput" type="text" placeholder="Last Name" name="lastname" required>

                <br>

                <!--gender-->
                <label class="secondRowText" for="gender">Gender</label>
                <br>
                <select id="gender" class="secondRowInput" name="gender" required>
                    <option class="secondRowInput">Male</option>
                    <option class="secondRowInput">Female</option>
                </select>

                <br>
            </div>
        </div>
        <hr id="characterCreatorTopTextLine">
        <button id="submitCharacterCreation" class="characterSubmitButton" type="submit" form="characterCreator"><i class="fas fa-plus-circle" style="color:white;"></i> Create Character</button>
        <button id="cancelCharacterCreation" class="characterResetButton" type="reset"><i class="fas fa-times-circle" style="color:white;"></i> Cancel</button>
    </form>

    <!--Edit character menu design-->
    <form id="characterEditor" class="characterMenu">
        <p id="characterCreatorTopText"><a class="fas fa-user-edit" style="color:white;"></a> Character Editor</p>
        <hr id="characterCreatorTopTextLine">
        <div id="characterInfoContainer">
            <div id="characterInfoContainerLeft">
                <!--First name-->
                <label class="firstRowText" for="firstname">First Name</label>
                <br>
                <input id="newFirstName" class="firstRowInput" type="text" placeholder="First Name" name="firstname" required>

                <br>

                <!--Dob-->
                <label class="secondRowText" for="dob">Date of Birth</label>
                <br>
                <input id="newDateOfBirth" class="secondRowInput" type="date" name="dob" max="9999-12-31" required>
				
				<br>

                <!-- Character CSN -->
                <label class="secondRowText" for="CSN">CSN</label>
                <div id="CreateCSN" style="font-size: 20px; cursor:cell; width: 95%; padding: 15px 14px; text-align: center; position:relative; background: none; color: white; border: 2px solid crimson;"></div>

            </div>
            <div id="characterInfoContainerRight">
                <!--Last name-->
                <label class="firstRowText" for="lastname">Last Name</label>
                <br>
                <input id="newLastName" style="width: 93%;" class="firstRowInput" type="text" placeholder="Last Name" name="lastname" required>
                
                <br>

                <!--gender-->
                <label class="secondRowText" for="gender">Gender</label>
                <br>
                <select id="newGender" class="secondRowInput" name="gender" required>
                    <option class="secondRowInput">Male</option>
                    <option class="secondRowInput">Female</option>
                </select>

                <br>
				<!--Department
                <label class="thirdRowText" for="department">Department</label>
                <br>
                <select id="newDepartment" class="thirdRowInput departments" name="department"></select>-->

            </div>
        </div>
        <hr id="characterCreatorTopTextLine">
        <button id="submitCharacterEditing" class="characterSubmitButton" type="submit" form="characterEditor"><a class="fas fa-plus-circle" style="color:white;"></a> Save Changes</button>
        <button id="cancelCharacterEditing" class="characterResetButton" type="reset"><a class="fas fa-times-circle" style="color:white;"></a> Cancel</button>
    </form>

    <!--Character Spawn options-->
    <section id="spawnLocation" class="spawnMenu">
        <p id="characterCreatorTopText"><a class="fas fa-map-marker-alt" style="color:white;"></a> Spawn Location</p>
        <hr id="characterCreatorTopTextLine">
        <div id="spawnMenuContainer">
            <!--Spawn locations will be added here-->
        </div>
        <hr id="characterCreatorTopTextLine" style="margin-top: 3vh;">
        <button id="tpDoNot" class="characterSubmitButton" style="margin-left: 26vw; margin-bottom: 2vh;"><i class="fas fa-compass" style="color:white;"></i> Last locations</button>
        <button id="tpCancel" class="characterResetButton"><i class="fas fa-times-circle" style="color:white;"></i> Cancel</button>
    </section>

    <!--Confirm exit game menu design-->
    <section id="exitGameMenu" class="confirmationScreen">
        <p id="characterCreatorTopText">Are you sure you'd like to quit the game?</p>
        <hr id="characterCreatorTopTextLine">
        <button id="exitGameConfirm" class="confirmationScreenConfirm"><i class="fas fa-check-circle" style="color:white;"></i> Confirm</button>
        <button id="exitGameCancel" class="confirmationScreenCancel"><i class="fas fa-times-circle" style="color:white;"></i> Cancel</button>
    </section>

    <!--Confirm delete character button-->
    <section id="deleteCharacterMenu" class="confirmationScreen">
        <p id="characterCreatorTopText">Are you sure you'd like to delete this character?</p>
        <hr id="characterCreatorTopTextLine">
        <button id="deleteCharacterConfirm" class="confirmationScreenConfirm"><i class="fas fa-check-circle" style="color:white;"></i> Confirm</button>
        <button id="deleteCharacterCancel" class="confirmationScreenCancel"><i class="fas fa-times-circle" style="color:white;"></i> Cancel</button>
    </section>
    <script src="CharacterCreation.js" defer></script>
</body>
</html>
