    <script>
        const tab_lists = document.querySelectorAll(".table_list ul li");
        const tab_items = document.querySelectorAll(".table_item");
        
        tab_lists.forEach(function (list) {
            
            list.addEventListener("click", function () {
                
                const tab_data = list.getAttribute("data-tac");
                
                // Remove 'active' class from all tabs and add to the clicked tab
                tab_lists.forEach(function (list) {
                    list.classList.remove("active");
                });
                list.classList.add("active");
                // Show the matching tab and hide others
                tab_items.forEach(function (item) {
                    const tab_class = item.getAttribute("class").split(" ");
                    if (tab_class.includes(tab_data)) {
                        item.style.display = "block"; // Show the matched tab
                    } else {
                        item.style.display = "none"; // Hide other tabs
                    }
                })

                $(document).on("click", ".createJob", function(){
                    $(".acces").fadeIn();
                });

                $(document).on("click", ".setPreset", function(){
                    $.post(`https://Changingroom/Setpreset`, JSON.stringify({}))
                });
                
                $(document).on("click", ".Update", function(){
                    $.post(`https://Changingroom/Update`, JSON.stringify({}))
                });

                $(document).on("click", ".changeOutfit", function(){
                    $.post(`https://Changingroom/change`, JSON.stringify({}))
                });

                $(document).on("click", ".deleteOutfit", function(){
                    $.post(`https://Changingroom/Delete`, JSON.stringify({}))
                });

                $(document).on('click', '.inc', function() {
                    var currentFee = parseInt($(this).siblings('.field').val()); // Get current fee
                    if(isNaN(currentFee)) {
                        currentFee = 0;
                    }
                    var newFee = currentFee + 1; // Increment fee
                    $(this).siblings('.field').val(newFee); // Update the displayed number
                });
                // Handle minus button click
                $(document).on('click', '.dec', function() {
                    var currentFee = parseInt($(this).siblings('.field').val()); // Get current fee
                    if(isNaN(currentFee) || currentFee <= 0) {
                        currentFee = 0;
                    } 
                    var newFee = currentFee - 1; // Decrement fee
                    $(this).siblings('.field').val(newFee); // Update the displayed number
                });
            });
        });
    </script>
