<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="nui://game/ui/jquery.js" type="text/javascript"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Police Vehicle</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        border-radius: 0;
        overflow: hidden;
        overflow-y: hidden;
        cursor: pointer;
        text-transform: capitalize;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: .4s;
        transition: .4s;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        -webkit-transition: .4s;
        transition: .4s;
    }

    input:checked+.slider {
        background-color: #2196F3;
    }

    input:focus+.slider {
        box-shadow: 0 0 1px #2196F3;
    }

    input:checked+.slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
    }

    /* Rounded sliders */
    .slider.round {
        border-radius: 34px;
    }

    .slider.round:before {
        border-radius: 50%;
    }

    select {
        background: #555;
        color: white;
    }
</style>

<body>
    <script src="SplitRescoues.js"></script>
    <script src="SplitRescoues.json"></script>
    <!--  -->
    <div class="Spawn_HUD" style="display:none; width: 30em; height: 30em; position: absolute; left: calc(50% - 15em); top: calc(50% - -5em); background: #555; color: white; border: 2px solid #555;">
        <P style="font-size: 15px;">Law Enforcement fleet vehicles</P>
        <hr>
        <select class="options" style="width: 100%;"disable></select>
        <select id="carStuff" style="width: 100%;" disable></select>
        <input  type="color" id="primary" style="width: 100%;">
        <input type="color" id="secondary" style="width: 100%;">
        <!-- <label class="switch"><input type="checkbox" id="SlickTop"><span class="slider round"></span></label> -->
        <button class="spawn" style="border-radius: 0px; border: none; width: 470px; height: 55px; background:blue; padding: 2px 2px; margin: 2px  0  1px; cursor: pointer;">Spawn</button>
        <button class="update" style="border-radius: 0px; border: none; width: 470px; height: 55px; background: blue; padding: 2px 2px; margin: 12px 0 1px; cursor: pointer;">Update</button>
        <button class="fix" style="border-radius: 0px; border: none; width: 470px; height: 55px; background: blue; padding: 2px 2px; margin: 12px 0 1px; cursor: pointer;">fix Vehicle</button>
        <button class="delete" style="border-radius: 0px; border: none; width: 470px; height: 55px; background: red; padding: 2px 2px; margin: 12px 0 1px; cursor: pointer;">Delete Vehicle</button>
        <button class="Cancel" style="border-radius: 0px; border: none; width: 470px; height: 55px; background:blue; padding: 2px 2px; margin: 12px  0  1px; cursor: pointer;">Cancel</button>

    </div>
</body>
</html>
