<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- <script src="nui://game/ui/jquery.js" type="text/javascript"></script> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.1.0/css/all.css">
    
</head>

<body>
    <script src="Impound.js" defer></script>
    <style>
        @import url('https://use.fontawesome.com/releases/v7.1.0/css/all.css');

        * {
            /* overflow: hidden; */
            border: none;
            outline: none;
            padding: 0;
            margin: 0;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .impound-buttons {
            position: relative;
            color: white;
            padding: .5vh;
            padding-left: 1vh;
            padding-right: 1vh;
            background: transparent;
            border-radius: 1vh;
            margin: auto;
        }

        .Close-impound {
            cursor: pointer;
            position: absolute;
            width: 30px;
            height: 20px;
            right: 10px;
            top: -10px;
            background: transparent;
            border: none;
            color: white;
            background: purple;
            margin: 10px 0 0;
            padding-right: 1px;
            padding-bottom: 0;
            margin-bottom: 0;
            text-align: center;
            border-radius: 50%;
        }

        .impound-cancel {
            margin-left: 0.2vw;
            height: 3.5vh;
            background-color: rgb(236, 19, 19);
            width: 100%;
            text-align: center;
            border-radius: 0.5vh;
            transition: 0.3s;
            cursor: pointer;
            margin-left: -5px;
        }

        .impound-cancel:hover {
            background: #f35d5d;
        }

        .impound-remove {
            margin-left: 0.2vw;
            height: 3.5vh;
            background-color: rgb(236, 19, 19);
            width: 100%;
            text-align: center;
            border-radius: 0.5vh;
            transition: 0.3s;
            cursor: pointer;
            margin-left: -5px;
        }

        .impound-remove:hover {
            background: #f35d5d;
        }

        .impound-submit {
            margin-left: 0.3vw;
            background-color: rgb(8, 252, 69);
            width: 100%;
            height: 3.5vh;
            text-align: center;
            border-radius: 0.5vh;
            transition: 0.3s;
            cursor: pointer;
            margin-left: -5px;
        }

        .impound-submit:hover {
            background: #15ac12;
        }
        
        select {
            width: 100%;
        }

        #custominput {
            display: inline-flex;
            justify-content: space-between;
            align-items: center;
            justify-items: center;
            position: absolute;
            background: #777;
            height: 35px;
            min-width: 89px;
        }

        .impound-retrive {
            margin-left: 0.3vw;
            background-color: rgb(8, 25, 72);
            width: 100%;
            height: 3.5vh;
            text-align: center;
            border-radius: 0.5vh;
            transition: 0.3s;
            cursor: pointer;
            margin-left: -5px;
        }

        .impound-retrive:hover {
            background: #3912ac;
        }

        #custominput span {
            width: 10%;
            text-align: center;
            font-size: 15px;
        }
    </style>
    <div style="position: absolute; top: 0%; right: 2%; text-align: left; opacity: 0.3; z-index: 999; color: rgb(184, 185, 185); font-size: 0.5vw; opacity: 0.8;">[Impound (R)]</div>
    <div class="ImpoundContainer" id="PoliceContainer" style="margin: 15px; position: absolute; border-radius: 5px; border: 17px solid gray; background: gray; color: white; width: 35em; height: 14em; top: calc(50% - -8em);  left: calc(50% - 20em);">

        <button class="Close-impound">&times;</button>
        <p style="background: black; color: white; font-size: 20px; text-align: center;">Police Impound</p>
        <select class="SelectImpound"><option></option><option>Impound</option><option>Police Impound</option><option>retrive</option></select>
        <div style="flex-direction: row;"><input type="number" class="impound-fee" id="fee" placeholder="Fee"style="width: 80%; margin-bottom: 15px; padding-bottom: 15px; text-transform: capitalize;" required><div id="custominput"><!--  --></div><br>
        
        <div class="impound-buttons">
            <div class="impound-cancel">Cancel</div>
            <div class="impound-submit">Submit</div>
            <div class="impound-retrive">retrive</div>
        </div>
    </div>
</body>

</html>
