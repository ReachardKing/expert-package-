<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Police Impound</title>
</head>
<style>
    @import url('https://use.fontawesome.com/releases/v7.1.0/css/all.css');

    * {
        padding: 0;
        margin: 0;
        text-transform: capitalize;
        box-sizing: border-box;
        overflow: hidden;
       
    }

    .close-quote {
        cursor: pointer;
        position: absolute;
        width: 30px;
        height: 20px;
        right: 10px;
        top: -10px;
        background: transparent;
        border: none;
        color: white;
        background: purple;
        margin: 10px 0 0;
        padding-right: 1px;
        padding-bottom: 0;
        margin-bottom: 0;
        text-align: center;
        border-radius: 50%;
    }
</style>
<body>
    <div class="ImpoundSettings" style="margin: 15.5px; border: 5px solid purple; background: lightblue; color: white; position: absolute; width: 35em; height: 17em; top: calc(50% - -15em); left: calc(50% - 17em);">
        <button class="close-quote">&times;</button>
		<button class="Policeimpound" style=" border: 5px solid green; background: blue; width: 545px; height: 45px; padding: 2px 2px; margin: 2px 0 5px; cursor: cell;"><i class="fas fa-car"></i> Police Impound</button>
        <button class="Normalimpound" style="border: 5px solid green; background: blue; width: 545px; height: 45px; padding: 2px 2px; margin: 2px 0 5px; cursor: cell;"><i class="fas fa-car"></i> Normal Impound</button>
        <button class="Raidimpound" style="border: 5px solid green; background: blue; width: 545px; height: 45px; padding: 2px 2px; margin: 2px 0 5px; cursor: cell;"><i class="fas fa-car"></i> Raid Impound</button>
        <button class="Haysimpound" style="cursor: pointer; border: 5px solid green; background: blue; width: 545px; height: 45px; padding: 2px 2px; margin: 2px 0 5px; cursor: cell;"><i class="fas fa-car"></i> Hays Impound</button>
        <button class="Buyvehicle" style="border: 5px solid green; background: blue; width: 545px; height: 45px; padding: 2px 2px; margin: 2px 0 5px;"><i class="fas fa-car"></i> Buy personal vehicles</button>
    </div>
    <div class="Show" id="impoundlist" style="margin: 15px; position: absolute; background: gray; color: white; width: 35em; height: 17em; top: calc(50% - -15em);  left: calc(50% - 17em); overflow-y: scroll;">
        <p style="background: black; text-align: center; margin-bottom: 5px;"><i class="fas fa-car"></i> Police impound list</p>
        <input type="text" id="search" placeholder="Search by plate or name" style="width: 100%; padding: 5px; margin-bottom: 10px; border: 2px solid purple;">
    </div>
    <div id="BuypersonalVehicle" class="Vehicles" style="margin: 15px; border: 5px solid purple; background: lightblue; color: white; position: absolute; width: 35em; height: 17em; top: calc(50% - -15em); left: calc(50% - 17em); overflow-y: scroll;">
        <p style="background: black; text-align: center; margin-bottom: 5px;">Buy Vehicle</p>
    </div>
    
    <script src="SelectImpound.js" defer></script>
</body>
</html>
