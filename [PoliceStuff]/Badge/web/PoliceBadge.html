<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Police Badge</title>
</head>
<style>
    * {
        overflow: hidden;
        text-transform: capitalize;
        margin: 0;
        padding: 0;
        outline: none;
        border: none;
    }

    p,
    h1,
    h2 {
        background: transparent;
        font-size: 11px;
        font-weight: bolder;
    }

    input {
        outline: none;
        border: none;
        border-radius: 0;
        background: transparent;
    }
    img {
        width: 100%;
        height: 100%;
        max-width: 200px;
        max-height: 200px;
        border-radius: 5px;
    }
    h1,h2,p {
        margin-bottom: 50px;
    }
</style>
<script src="PoliceBadge.js"></script>

<body>
    <div id="displaybadge" style="margin: 15px; position: absolute; width: 28em; height: 17em; background: lightblue;  border-radius: 5px; top: calc(50% - 20em); left: calc(50% - -15em);">
        <p>Department Badge</p>
        <div style="width: 50%; float:left; text-align: center;">
            <h1>Los Santos Police Department</h1>
            <h2>Badge Number: <span id="badgeNumber"></span></h2>
            <p>Issued to: <span id="badgeName"></span></p>
            <p>Rank: <span id="badgeRank"></span></p>
            <p>Issued on: <span id="badgeDate"></span></p>
        </div>

        <!-- person Image -->

        <div style="width: 50%; display: inline-block; text-align: center;">
            <img src=`${badgeImage}` alt="LSPD.png" id="badgeImage1">
            <p></p>
        </div>
    </div>
</body>
</html>
